<!Doctype Html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ToDO Liste</title>
<style>
html, body {
margin: 0;
padding: 0;
width: 100%;
height: 100%;
font-family: Arial, sans-serif;
background-color: #f4f4f4;
}

h1 {
text-align: center;
margin: 20px 0;
color: #333;
}

.container {
width: 100%;
max-width: 1200px;
margin: 0 auto;
padding: 20px;
}

.accordion {
width: 100%;
max-width: 800px;
margin: 20px auto;
}

.accordion .block {
background-color: #fff;
border: 1px solid #ddd;
border-radius: 5px;
overflow: hidden;
margin-bottom: 10px;
box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
}

.accordion .content {
padding: 1em;
background-color: #ffffff;
display: none;
}

.accordion .content.open {
display: block;
}

.accordion .opener {
border: 0;
padding: 1em;
display: block;
width: 100%;
font-size: 1.2em;
background-color: #007bff;
color: white;
text-align: center;
cursor: pointer;
transition: background-color 0.3s;
}

.accordion .opener:hover {
background-color: #0056b3;
}

form {
display: flex;
flex-direction: column;
max-width: 400px;
margin: 0 auto;
}

form p {
margin: 10px 0;
}

input[type="email"],
input[type="password"] {
width: 100%;
padding: 10px;
margin: 5px 0;
border: 1px solid #ddd;
border-radius: 5px;
box-sizing: border-box;
}

button {
padding: 10px 20px;
background-color: #007bff;
color: white;
border: none;
cursor: pointer;
border-radius: 5px;
font-size: 1em;
transition: background-color 0.3s;
}

button:hover {
background-color: #0056b3;
}

table {
width: 100%;
border-collapse: collapse;
margin: 20px 0;
}

table, th, td {
border: 1px solid #ddd;
}

th, td {
padding: 8px;
text-align: left;
}

th {
background-color: #007bff;
color: white;
}
p {
text-align: center;
}

</style>
</head>
<body>
<div class="container">
<h1>ToDO Liste</h1>
