</div>
<script>
function openElementOnClick(evt) {
    let content = evt.target.nextElementSibling;
    if (content.classList.contains('open')) {
        content.classList.remove('open');
    } else {
        let allcontents = evt.target.parentElement.parentElement.querySelectorAll('.content');
        for (let e of allcontents) {
            e.classList.remove('open');
        }
        content.classList.add('open');
    }
}
function initacc() {
    let openers = document.querySelectorAll('.accordion .opener');
    for (let e of openers) {
        e.onclick = openElementOnClick;
    }
}
let mymap;
function initmap() {
    let osmUrl = 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png';
    let osmAtt = '<a href="https://openstreetmap.org">OpenStreetMap</a>';
    let args = {
        minZoom: 4,
        maxZoom: 20,
        attribution: osmAtt
    };
    let osm = new L.TileLayer(osmUrl, args);
    mymap = new L.Map('mapid');
    mymap.setView([53.5363, 8.5786], 15);
    mymap.addLayer(osm);
}
function setupmapinit() {
    let mapOpener = document.getElementById('map-opener');
    mapOpener.addEventListener('click', function() {
        let mapContainer = document.getElementById('mapid');
        if (mapContainer && !mymap) {
            initmap();
        }
    });
}
window.onload = function() {
    initacc();
    setupmapinit();
};</script>
</body></html>
